apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: document-assembly-gateway-ingress
  namespace: document-assembly
  labels:
    app.kubernetes.io/name: document-assembly-gateway-ingress
    app.kubernetes.io/component: ingress
  # annotations:
  #   nginx.ingress.kubernetes.io/rewrite-target: /
  #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    # Backend API
    - host: gateway.document.<CLUSTER_IP>.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: document-gateway-service
                port:
                  number: 80
  # # HTTPS case
  # tls:
  #   - hosts:
  #       - gateway.document.<CLUSTER_IP>.nip.io
  #     secretName: document-assembly-tls
