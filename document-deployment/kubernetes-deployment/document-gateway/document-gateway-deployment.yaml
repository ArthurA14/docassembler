apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-gateway-deployment
  namespace: document-assembly
  labels:
    app.kubernetes.io/name: document-gateway-deployment
    app.kubernetes.io/component: document-gateway
spec:
  replicas: 1  # 2
  selector:
    matchLabels:
      app.kubernetes.io/name: document-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-gateway
        app.kubernetes.io/component: document-gateway
    spec:
      # initContainer to pre-populate /app/shared if PVC is empty
      initContainers:
        - name: seed-shared
          image: nexus.docker.registry/document-assembly-gateway/document-shared-assets:v3.1.0
          # image: <NEXUS_INTERNAL_IP>:8083/document-assembly-gateway/document-shared-assets:v3.1.0
          imagePullPolicy: Always  # IfNotPresent
          env:
            - name: ASSETS_VERSION
              value: "v3.1.0"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              CURRENT_VERSION="$(cat /mnt/shared/.assets-version 2>/dev/null || true)"

              # Copy only if the PVC content is updated
              if [ "$CURRENT_VERSION" != "$ASSETS_VERSION" ]; then
                echo "Updating shared volume to version $ASSETS_VERSION"
                mkdir -p /mnt/shared/config /mnt/shared/prompts
                rm -rf /mnt/shared/config/* /mnt/shared/prompts/*
                cp -r --no-preserve=ownership /seed/config/. /mnt/shared/config/
                cp -r --no-preserve=ownership /seed/prompts/. /mnt/shared/prompts/
                echo "$ASSETS_VERSION" > /mnt/shared/.assets-version
              else
                echo "Shared volume already up to date, skipping."
              fi
          volumeMounts:
            - name: shared-pvc
              mountPath: /mnt/shared

      containers:
        - name: document-gateway
          image: nexus.docker.registry/document-assembly-gateway/document-gateway:v3.1.1
          # image: <NEXUS_INTERNAL_IP>:8083/document-assembly-gateway/document-gateway:v3.1.1
          imagePullPolicy: Always  # IfNotPresent

          ports:
            - name: http
              # protocol: TCP
              containerPort: 5000

          envFrom:
            - configMapRef:
                name: document-assembly-common-config

          volumeMounts:
            # 1) All shared via PVC
            - name: shared-pvc
              mountPath: /app/hub
              subPath: hub

            - name: shared-pvc
              mountPath: /app/config
              subPath: config

            - name: shared-pvc
              mountPath: /app/prompts
              subPath: prompts

            # 2) One-off overlays from the ConfigMap
            - name: config-tree
              mountPath: /app/config/configs/api/settings.yaml
              subPath: configs/api/settings.yaml

            - name: config-tree
              mountPath: /app/config/configs/db/db_setup.yaml
              subPath: configs/db/db_setup.yaml

            - name: config-tree
              mountPath: /app/config/configs/embedder/embedder.yaml
              subPath: configs/embedder/embedder.yaml

            - name: config-tree
              mountPath: /app/config/configs/llm/llm_config.yaml
              subPath: configs/llm/llm_config.yaml

            - name: config-tree
              mountPath: /app/config/configs/parser/parser.yaml
              subPath: configs/parser/parser.yaml

            # 3) Cache-volume
            - name: cache-volume
              mountPath: /app/.cache

          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60  # 60 * 5s = 5 minutes allowed to start

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "10000m"  # = 10 CPUs
              memory: "4Gi"

      volumes:
        - name: shared-pvc
          persistentVolumeClaim:
            claimName: document-assembly-shared-assets-pvc

        - name: cache-volume
          emptyDir:
            sizeLimit: 10Gi

        - name: config-tree
          configMap:
            name: document-assembly-common-config
            items:
              - key: api-settings.yaml
                path: configs/api/settings.yaml

              - key: db-setup.yaml
                path: configs/db/db_setup.yaml

              - key: embedder-settings.yaml
                path: configs/embedder/embedder.yaml

              - key: llm-config.yaml
                path: configs/llm/llm_config.yaml

              - key: parser-settings.yaml
                path: configs/parser/parser.yaml

              - key: reranker-settings.yaml
                path: configs/reranker/reranker.yaml

      imagePullSecrets:
        - name: nexusdns
      restartPolicy: Always
