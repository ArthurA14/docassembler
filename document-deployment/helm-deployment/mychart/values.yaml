version: v3.1.0

metadata:
  nameOverride: document-assembly
  fullnameOverride: ""   # document-assembly-v3.1.0
  namespaceOverride: ""  # doc-assembler-depl
  component: platform

namespace:
  create: false  # DO NOT PUT TO 'true' - the dedicated namespace `doc-assembler-depl` already exists

imagePullSecrets:
  enabled: true
  existingSecrets:
    - nexusdns

container:
  portName: http
  # protocol: TCP
  port: 5000

service:
  type: ClusterIP

sharedAssets:
  enabled: true
  storageClassName: nfs-csi  # default - can be omitted
  accessModes:
    - ReadWriteMany  # ReadOnlyMany  # ReadWriteOnce
  size: 10Gi

cacheVolume:
  enabled: true
  sizeLimit: 10Gi

secrets: {}

cluster:
  ip: "<CLUSTER_IP>"
  nipHost: "<CLUSTER_IP>.nip.io"

hostAliases:
  - ip: "<GITLAB_INTERNAL_INSTANCE_IP>"
    hostnames:
      - "gitlab.internal.instance.com"

redis:
  enabled: true
  image:
    fullName: redis
    tag: 8.4.2-trixie
    pullPolicy: IfNotPresent

  args:
    - "redis-server"
    - "--appendonly"
    - "yes"

  service:
    name: redis
    port: 6379
    targetPort: 6379
    type: ClusterIP

  statefulset:
    replicas: 1

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

config:
  env:
    # Celery Configuration
    # CELERY_BROKER_URL: "redis://redis.doc-assembler-depl.svc.cluster.local:6379/0"
    CELERY_BROKER_URL: ""      # "redis://redis:6379/0"
    CELERY_RESULT_BACKEND: ""  # "redis://redis:6379/1"
    PYTHONPATH: "/app"

    # Redis Configuration (for direct access if needed)
    REDIS_HOST: ""             # "redis.doc-assembler-depl.svc.cluster.local"
    REDIS_PORT: "6379"
    REDIS_DB: "0"

    # Application Configuration
    FASTAPI_ENV: "prod"
    LOG_LEVEL: "INFO"

    # # Database Configuration
    # DATABASE_URL: "http://qdrant.genai.<CLUSTER_IP>.nip.io:80"
    # DATABASE_URL: "http://qdrant.genai.{{ .Values.cluster.nipHost }}:80"
    # DATABASE_TYPE: "qdrant"

    # Cache Configuration
    HF_HOME: "/app/.cache/huggingface"
    TRANSFORMERS_CACHE: "/app/.cache/huggingface"

  files:
    api-settings.yaml: |
      # Configuration will be done at .env level
      app_name: document_assembly
      # app_version: v3.1.0
      # app_description: "API for document assembly framework."
      # host: localhost
      # port: 8797
      # debug: true

    db-setup.yaml: |
      database: elastic # elastic, qdrant or inmemory, if elastic or qdrant : url needed
      # url: http://qdrant.genai.<CLUSTER_IP>.nip.io:80
      url: http://elastic.genai.<CLUSTER_IP>.nip.io:80

      indexes:
        sections:
          name: "sections"
          description: "Generated sections and their metadata used in generated documents using the 'document assembly' system"
        documents:
          name: "documents"
          description: "Generated documents and their metadata using the 'document assembly' system"
        files:
          name: "files"
          description: "Original files metadata and storage"
        documents:
          name: "documents"
          description: "Extracted text and knowledge from files"
        feedback:
          name: "feedback"
          decription: "Feedback collected from users"
        prompts:
          name: "prompts"
          decription: "User-defined and system prompts used for document assembly"
        templates:
          name: "templates"
          decription: "Template structures for generating documents, including static and dynamic versions"
        eval:
          name: "eval"
          description: "Playground for evaluation on the MSRS dataset"
          embedding_dim: 2560
      embed_chunks: True

    embedder-settings.yaml: |
      # 2 types are allowed : `inmemory` for embedding on the running pc, `api` for running the embedding from a docker with an api.
      # if type is `inmemory` a `model` and a `dimension` can be specified
      # if type is `api` an `url` and a `dimension` MUST be provided
      #     -> The docker should accept at the specified url a json with a 'text' attribute and return a json with a 'vector' attribute that is a List[float]
      # type: api
      # url: "http://tei.genai.<CLUSTER_IP>.nip.io/" # "tei" stands for "text-embedding-inference"
      # # model: sentence-transformers/all-roberta-large-v1
      # dimension: 1024
      ## AZATHOTH SETTINGS
      type: api
      url: "http://vllm.<CLUSTER_IP>.nip.io/v1"
      model: "qwen3-embed-4b"
      dimension: 768
      ## LOCAL SETTINGS
      # type: api
      # url: "http://localhost:7502/"
      # dimension: 768Z

    llm-config.yaml: |
      ## LOCAL SETTINGS
      # model: "/models/unsloth/gemma-3-1b-it-GGUF/gemma-3-1b-it-Q4_K_M.gguf"
      # api_url: "http://localhost:7501/v1"
      ## AZATHOTH SETTINGS
      model: "qwen3.6-35b"  # "qwen3.5-9b"
      base_url: "http://vllm.<CLUSTER_IP>.nip.io/v1"
      ## COMMON
      api_key: "no api key"
      temperature: 0.70
      max_output_tokens: 8192
      timeout: 10000.0
      top_p: 0.8

    parser-settings.yaml: |
      url: http://parser.genai.<CLUSTER_IP>.nip.io/v1alpha/convert/file

    reranker-settings.yaml: |
      # Reranker Configuration
      # Supports both document retrieval reranking (Issue #25) and citation text pair scoring (Issue #33)

      # API Configuration
      api:
        url: "http://vllm.<CLUSTER_IP>.nip.io/v1/rerank"
        api_key_env_var: "QWEN_API_KEY"
        model: "qwen3-rerank-4b"  # "bge-reranker-v2-m3"
        timeout_seconds: 10
        max_retries: 2
        retry_delay: 1.0

      # Document Reranking Mode (Issue #25)
      # Used in retrieval pipeline to improve document ranking for summary assembly
      document_mode:
        enabled: true
        top_k_input: 100 # Number of documents to send to reranker (from initial retrieval)
        top_k_output: 50 # Number of documents to return after reranking
        min_score: 0.0 # Minimum relevance score to keep a document
        normalize_scores: true # Normalize scores to 0-1 range
        fallback_to_embedding: true # Fall back to embedding scores on API failure

      # Citation Text Pair Mode
      # Used for scoring relevance between generated text and source chunks
      citation_mode:
        enabled: true
        batch_size: 32 # Number of text pairs to score per API request
        base_threshold: 0.75 # Base relevance threshold for matches
        normalize_scores: true # Normalize scores to 0-1 range

        # Adaptive threshold retry
        adaptive_retry:
          enabled: false
          max_retries: 2
          threshold_decrement: 0.1 # Lower threshold by this amount on retry
          min_threshold: 0.50 # Don't go below this threshold

        # Fallback to string matching
        fuzzy_fallback:
          enabled: true
          threshold: 0.85 # RapidFuzz threshold for string matching
          scorer: "token_sort_ratio" # Options: token_sort_ratio, partial_ratio, ratio
          min_length: 10 # Minimum text length for fuzzy matching

        # Source sentence caching
        cache:
          enabled: true
          max_size: 10000 # Maximum cached source sentences
          ttl_seconds: 3600 # Cache expiration time

      # Logging
      logging:
        log_api_calls: true
        log_fallbacks: true
        log_scores: false # Set to true for debugging
        log_latency: true

      # Performance
      performance:
        async_enabled: false # Enable async API calls (future)
        batch_parallel: false # Process batches in parallel (future)

components:
  gateway:
    enabled: true
    kind: deployment
    name: document-gateway
    component: document-gateway

    image:
      fullName: nexus.docker.registry/document-assembly-gateway/document-gateway
      tag: v3.1.1
      pullPolicy: Always  # IfNotPresent

    container:
      enabled: true
      portName: http
      # protocol: TCP
      port: 5000

    service:
      enabled: true
      # name: document-gateway-service
      type: ClusterIP

      ports:
        - name: http
          protocol: TCP
          port: 80
          targetPort: 5000
        # nodePort: 30100

        # - name: https
        #   protocol: TCP
        #   port: 443
        #   targetPort: 5000

    deployment:
      replicaCount: 1  # 2

    initContainer:
      enabled: true
      name: seed-shared
      image:
        fullName: nexus.docker.registry/document-assembly-gateway/document-shared-assets
        tag: v3.1.0
        pullPolicy: Always  # IfNotPresent
      assetsVersion: v3.1.0

    probes:
      startup:
        enabled: true
        type: http
        path: /health
        port: 5000
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 60  # 60 * 5s = 5 minutes allowed to start

      readiness:
        enabled: true
        type: http
        path: /health
        port: 5000
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6

      liveness:
        enabled: true
        type: http
        path: /health
        port: 5000
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 6

    resources:
      requests:
        cpu: "10000m"
        memory: "4Gi"
      limits: {}
# ------------------------------
  importationWorker:
    enabled: false
    kind: deployment
    name: import-worker
    component: document-importation-worker

    image:
      fullName: nexus.docker.registry/document-assembly-gateway/import-worker
      tag: v3.1.0
      pullPolicy: Always  # IfNotPresent

    deployment:
      replicaCount: 1  # 2

    command:
      - celery
    args:
      - -A
      - celery_tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
      - -Q
      - importation,celery

    probes:
      readiness:
        enabled: true
        type: exec
        command:
          - /bin/sh
          - -c
          - celery -A celery_tasks.celery_app inspect ping >/dev/null 2>&1
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 6

      liveness:
        enabled: false
        type: exec
        command:
          - /bin/sh
          - -c
          - pgrep -f 'celery.*worker' >/dev/null
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

    resources:
      requests:
        cpu: "10000m"
        memory: "4Gi"
      limits:
        memory: "8Gi"
        # nvidia.com/gpu: "1"
        # nvidia.com/gpumem-percentage: 10  # 25
# ------------------------------
  docassemblerWorker:
    enabled: false
    kind: deployment
    name: docassembler-worker
    component: document-assembly-worker

    image:
      fullName: nexus.docker.registry/document-assembly-gateway/docassembler-worker
      tag: v3.1.0
      pullPolicy: Always  # IfNotPresent

    deployment:
      replicaCount: 1  # 2

    command:
      - celery
    args:
      - -A
      - celery_tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
      - -Q
      - docassembler,celery

    probes:
      readiness:
        enabled: true
        type: exec
        command:
          - /bin/sh
          - -c
          - celery -A celery_tasks.celery_app inspect ping >/dev/null 2>&1
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 6

      liveness:
        enabled: false
        type: exec
        command:
          - /bin/sh
          - -c
          - pgrep -f 'celery.*worker' >/dev/null
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

    resources:
      requests:
        cpu: "10000m"
        memory: "4Gi"
      limits:
        memory: "8Gi"
        # nvidia.com/gpu: "1"
        # nvidia.com/gpumem-percentage: 10  # 25

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  rules:
    # Backend API
    # - host: gateway.document.<CLUSTER_IP>.nip.io
    # - host: document-gateway.<CLUSTER_IP>.nip.io
    - host: document-gateway-argocd.<CLUSTER_IP>.nip.io
      paths:
        - path: /
          pathType: Prefix
          service:
            # name: document-gateway-service
            portName: http
            portNumber: 80
