{{- $root := . -}}
{{- $appVersion := $root.Chart.AppVersion | replace "." "-" | lower -}}
{{- $clusterIp := .Values.cluster.ip | default "<CLUSTER_IP>" -}}
{{- $nipHost := .Values.cluster.nipHost | default (printf "%s.nip.io" $clusterIp) -}}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "projectname.fullname" . }}-gateway-ingress
  namespace: {{ include "projectname.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "projectname.fullname" . }}-gateway-ingress
    app.kubernetes.io/component: ingress
    {{/* include "projectname.labels" . | nindent 4 */}}
  {{- with .Values.ingress.annotations }}
  annotations:
  {{ toYaml . | indent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" | quote }}
  # ingressClassName: {{ default "nginx" .Values.ingress.className | quote }}
  rules:
    {{- range .Values.ingress.rules }}
    - host: {{ .host | replace "<CLUSTER_IP>.nip.io" $nipHost | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ default "/" .path | quote }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ printf "%s-%s-service" $root.Values.components.gateway.name $appVersion }}
                port:
                  {{- if .service.portName }}
                  name: {{ .service.portName | quote }}
                  {{- else }}
                  number: {{ .service.portNumber }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
