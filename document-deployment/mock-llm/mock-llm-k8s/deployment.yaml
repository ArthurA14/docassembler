apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: doc-assembler-depl
  labels:
    app.kubernetes.io/name: mock-llm
    app.kubernetes.io/component: mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
      app.kubernetes.io/component: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
        app.kubernetes.io/component: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: nexus.docker.registry/document-assembly-gateway/mock-llm:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

      imagePullSecrets:
        - name: nexusdns
      restartPolicy: Always
