type: recursive # choices; recursive / semantic / sentence

semantic: # https://docs.chonkie.ai/python-sdk/chunkers/semantic-chunker#parameters
  embedding_model: "intfloat/multilingual-e5-large-instruct"
  threshold: 0.9
  mode: "cumulative"
  chunk_size: 600
  similarity_window: 2
  skip_window: 20
  delim: ["\n\n"]

sentence: # https://docs.chonkie.ai/python-sdk/chunkers/sentence-chunker#parameters
  tokenizer_or_token_counter: hub/tokenizer.json
  chunk_size: 2048
  chunk_overlap: 128
  min_sentence_per_chunk: 1

recursive: # https://docs.chonkie.ai/python-sdk/chunkers/recursive-chunker#parameters
  tokenizer_or_token_counter: hub/tokenizer.json
  chunk_size: 256
  recipe_path: "config/configs/chunking/recipe/tiladi.json"
