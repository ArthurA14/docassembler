# Template for Python jobs with uv
.python-uv-job:
  image: python:${PYTHON_VERSION}
  # variables:
  #   UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  # cache:
  #   key: "uv-${CI_JOB_IMAGE}"
  #   # key: "uv-${CI_JOB_IMAGE}-${CI_COMMIT_SHA}"  # A new blank cache for each job execution try - use with caution (could be heavy)
  #   paths:
  #     - .cache/uv
  #     - .cache/pip
  before_script:
    - echo "${GITLAB_INTERNAL_IP} ${GITLAB_INTERNAL_HOST}" >> /etc/hosts
    - getent hosts "${GITLAB_INTERNAL_HOST}"

    - |
      cat > ~/.netrc <<EOF
      machine "${GITLAB_INTERNAL_HOST}"
      login gitlab-ci-token
      password "${CI_JOB_TOKEN}"
      EOF
    - chmod 600 ~/.netrc

    - python -m pip install --upgrade pip
  
    - python -m pip install "uv==${UV_VERSION}" ruff black pytest
    - uv --version
    # - uv sync --frozen --dev

  # before_script:
  #   - apt-get update && apt-get install -y curl ca-certificates
  #   - curl -LsSf https://astral.sh/uv/install.sh | sh
  #   - export PATH="$HOME/.local/bin:$PATH"
  #   - uv --version
  #   - python -m pip install ruff black  # - uv sync --frozen --dev


.python:lint:
  stage: lint
  extends: .python-uv-job
  script:
    - uv run ruff check .       # - ruff check .     # static lint checks
    # - uv run black --check .  # - black --check .  # format lint checks
    # `py_compile` to catch "hard" syntax errors & uvicorn errors
    - python -m py_compile $(find src api_gateway celery_tasks -name '*.py')
  rules:
    - if: '$CI_COMMIT_BRANCH'
  

