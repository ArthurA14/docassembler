[project]
name = "document"
version = "3.1.0"
description = "A framework for generating documents on any subject given documents and a title."
authors = [
    { name = "Contributor Two", email = "contributor.two@example.com" },
    { name = "Contributor One", email = "contributor.one@example.com" },
    { name = "Contributor Three", email = "contributor.three@example.com" },
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.9.2,<3",
    "haystack-ai>=2.11.2,<3",
    "celery>=5.6.2",
    "redis>=7.3.0",
    "fastapi>=0.115.11,<0.116",
    "uvicorn[standard]>=0.35.0",
    "document-common==0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
]

eval = [
    "dotenv>=0.9.9,<0.10",
    "datasets>=4.4.1",
    "mlflow>=3.7.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "nexus"
url = "http://nexus.internal:8082/repository/gitlab-pypi-internal/simple/"
explicit = true
authenticate = "always"

[tool.uv.sources]
document-common = { index = "nexus" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
ignore = ["I001"]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/components/base/document_store.py" = ["F841"]
"src/eval/MSRS_eval/mlflow_eval.py" = ["F841"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pyrefly]
search-path = [".", "src"]

[tool.pytest.ini_options]
pythonpath = ["."]
