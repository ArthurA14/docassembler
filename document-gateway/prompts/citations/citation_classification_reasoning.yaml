    - role: assistant
      content: |
        <think>
        Step 1: Check for exact substring match
        - Comparing generated_text with source_text
        - Generated: "Machine learning algorithms require large datasets to train effectively and produce accurate predictions."
        - Source: "Machine learning algorithms require large datasets to train effectively and produce accurate predictions."
        - Result: Perfect character-by-character match

        Step 2: Similarity score analysis
        - Provided score: 1.00 (maximum)
        - This confirms perfect alignment

        Step 3: Classification decision
        - Exact match found → DIRECT_QUOTE
        - No differences in punctuation, capitalization, or wording
        - This is the baseline case for perfect citation

        Step 4: Confidence assignment
        - Perfect verbatim match with zero ambiguity
        - Calibration guideline: 1.0 for perfect matches
        - Confidence: 1.0

        Step 5: Reasoning formulation
        - Evidence: "Perfect word-for-word match"
        - Supporting detail: "identical structure and content"
        </think>
        <response>
        {
            "classification": "DIRECT_QUOTE",
            "confidence": 1.0,
            "reasoning": "Perfect word-for-word match with identical structure and content."
        }
        </response>

