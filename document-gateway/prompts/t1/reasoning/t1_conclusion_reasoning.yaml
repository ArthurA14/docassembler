# Purpose: Reasoning-optimized section assembly prompts with interleaved thinking
# Created: 2025-11-07
# Refactoring Focus: Adaptation for reasoning models with explicit thinking scaffolding
# Contains: context, introduction, conclusion, and hook assembly prompts with <think> tags
version: 1

t1_conclusion_reasoning:
  system: |
    Role: Evidence-Based Finalization Expert

    <reasoning_model_instruction>
    This prompt is optimized for reasoning models that employ interleaved thinking. You will be provided with few-shot examples that demonstrate the expected reasoning process and output format.

    For each task:
    1. Use internal thinking to analyze the problem and plan your approach
    2. Generate your response in the specified format
    3. Interleaved thinking and responses follow this structure:
       <think>Your internal reasoning process specific to this example or task</think>
       <response>Your final output in the required format</response>

    The response section must ALWAYS contain ONLY the paragraph text with no additional text, explanation, or formatting outside the response tags.
    </reasoning_model_instruction>

    Task: Produce a 50-100 word conclusion grounded in presented data, reinforcing analytical validity while maintaining prudent positioning.

    Inputs:
     - full_document: Complete document components
     - language: Output language requirement

    Structural Mandates:
    1. Open with irrefutable evidence anchor (single verified fact from document body)
    2. Restate core problem through solution lens
    3. Outline implementation realities (acknowledge constraints, risks, resource requirements)
    4. Close with measured value proposition

    Constraints:
     - Start with single verified fact from document body
     - Avoid speculative "future of" statements
     - Reference the most important ideas of the document
     - Include risk acknowledgement or implementation constraints
     - Do NOT fabricate percentages, figures, or statistics unless explicitly present in the document
     - {{language}} compliance imperative

    <output_mandate>
    Output Mandate:
    - ALWAYS wrap your response in <think>...</think><response>...</response> tags
    - The content within <response> tags MUST be ONLY the paragraph text
    - The paragraph must be complete, natural prose with proper sentence structure
    - NO explanatory text, NO markdown, NO prose outside the response tags
    </output_mandate>

    Format Requirements:
     - Single coherent paragraph
     - No bullet points, headings, or structural formatting
     - Professional business language
     - No direct attribution phrases like "According to the document..."

  examples:
    - role: user
      content: |
        <full_document>
        ### Context
        Strategic automation investments offer GreenTech Manufacturing the highest near-term ROI (22% within 3 years) while addressing current operational constraints that threaten competitive positioning in the rapidly expanding sustainable components market. How can GreenTech Manufacturing optimize its capital allocation to support expansion while maintaining financial stability amid ongoing supply chain uncertainties? This document provides the Board with a comprehensive analysis of capital allocation options that balances immediate growth imperatives against financial resilience requirements.

        ### Introduction
        Manufacturing capacity utilization rates exceeding 85% signal impending growth constraints across the industry, creating strategic pressure for capital investment decisions. GreenTech faces this challenge at a pivotal juncture: expand production capacity to meet surging demand for sustainable components or prioritize operational efficiency and supply chain resilience. This analysis equips the Board with a risk-calibrated framework for capital deployment, synthesizing implementation data from peer organizations and proprietary scenario modeling.

        ### document Body
        1. Market Analysis
           - Current manufacturing capacity at 87% utilization
           - Competitor expansion creating market share pressure
           - Supply chain disruptions affecting 23% of component sourcing
        2. Investment Options Assessment
           - Option A: $15M facility expansion (ROI: 18% at 5 years)
           - Option B: $8M automation upgrade (ROI: 22% at 3 years)
           - Option C: $12M supplier acquisition (ROI: 15% at 4 years)
        3. Risk Analysis
           - Supply chain vulnerability scoring
           - Cash flow resilience modeling
           - Competitive response scenarios
        4. Recommendations
           - Phased implementation of Option B then A
           - Contingency fund establishment
           - Supplier diversification program"
        </full_document>

        <language>english</language>

    - role: assistant
      content: |
        <think>
        Systematic analysis for conclusion assembly:

        STEP 1: IDENTIFY STRUCTURAL MANDATES
        1. Irrefutable evidence anchor (verified fact from document)
        2. Core problem restated through solution lens
        3. Implementation realities (constraints, risks, resources)
        4. Measured value proposition

        STEP 2: FIND IRREFUTABLE EVIDENCE FOR OPENING
        Scanning document for verified, specific facts:
        - 87% capacity utilization (verified)
        - 22% ROI for Option B in 3 years (verified)
        - $8M automation upgrade cost (verified)
        - 23% supply chain disruption (verified)
        - Phased implementation B then A (recommendation)

        Best anchor: "The automation upgrade option delivers the highest projected ROI at 22% within 3 years"
        - Specific, measurable
        - Directly supports conclusion
        - Irrefutable from document data

        STEP 3: RESTATE PROBLEM THROUGH SOLUTION
        Original problem: How to optimize capital allocation for expansion while maintaining stability
        Through solution lens: Automation validates as most viable path to balance growth and resilience
        - Acknowledges both dimensions (growth + stability)
        - Shows solution addresses core tension

        STEP 4: IDENTIFY IMPLEMENTATION REALITIES TO ACKNOWLEDGE
        Must be honest about constraints and risks:
        - Integration timelines (legacy system compatibility)
        - Workforce retraining requirements
        - Assumptions about component pricing
        - Dependency on supplier diversification

        These demonstrate prudent, realistic positioning.

        STEP 5: CRAFT MEASURED VALUE PROPOSITION
        Not overselling, but demonstrating clear benefits:
        - Risk-calibrated execution roadmap
        - Addresses core challenge
        - Maintains debt covenant compliance
        - Provides Board with actionable framework

        STEP 6: WORD COUNT TARGET
        50-100 words required
        Targeting ~85 words for comprehensive development

        STEP 7: CONSTRAINT VALIDATION
        ✓ Opens with verified fact (22% ROI)
        ✓ No speculative language
        ✓ References key document ideas (automation, capacity, supply chain)
        ✓ Includes explicit risk/constraint acknowledgement
        ✓ No fabricated statistics (all from document)
        ✓ English language
        ✓ Professional tone
        ✓ Measured, not overselling

        STEP 8: FINAL STRUCTURE CHECK
        Opening → Problem through solution → Implementation realities → Value proposition
        Natural flow, no obvious templating
        </think>
        <response>
        The automation upgrade option delivers the highest projected ROI at 22% within 3 years while directly addressing current capacity constraints. This analysis validates automation-focused capital deployment as the most viable path to balance growth requirements with supply chain resilience, though three implementation realities warrant emphasis: integration timelines remain subject to legacy system compatibility, workforce retraining will require dedicated resources, and expected returns assume sustained component pricing from diversified suppliers. These findings collectively address the core challenge of optimizing capital allocation for expansion while maintaining financial stability, providing the Board with a risk-calibrated execution roadmap that preserves compliance with existing debt covenants.
        </response>

  query: |
    <assembly_instruction>
    When responding to this query, you MUST:
    1. Use internal thinking to analyze the document and identify evidence
    2. Generate your response following this structure:
       <think>[Your reasoning process analyzing evidence, problem restatement, risks, and value]</think>
       <response>[ONLY the paragraph text—no explanation]</response>

    The response MUST contain ONLY the conclusion paragraph with no additional text.
    </assembly_instruction>

    <full_document>
    {{intro}}
    {{context}}
    {{main}}
    </full_document>

    <language>
    {{language}}
    </language>

  input_types:
    section: Section
    main: str
    language: str
