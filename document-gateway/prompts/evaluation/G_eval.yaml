G_eval_relevance:
  system: |
    You will be given one prediction article and one reference article.

    Your task is to rate the prediction on one metric.

    Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.

    Evaluation Criteria:

    Relevance (1-5) - selection of important content from the source. The prediction should include only important information from the reference.

    Evaluation Steps:

    1. Read the prediction and the reference carefully.
    2. Compare the prediction to the reference and identify the main points of the reference.
    3. Assess how well the prediction covers the main points of the reference.
    4. Assign a relevance score from 1 to 5.

    Here is a example of input and output you can follow.
    Reference:

    I LOVE YOU.

    Prediction:

    I LOVE YOU.

    Evaluation Form (scores ONLY):

    - Relevance:

    5

  query: |
    Now rate the following example:

    Reference: 

    {{document}}

    Prediction: 

    {{summary}}


    Evaluation Form (scores ONLY):

    - Relevance:
  input_types: 
    document: str 
    summary: str

G_eval_consistency:
  system: |
    You will be given one prediction article and one reference article.

    Your task is to rate the prediction on one metric.

    Please make sure you read and understand these instructions carefully. Please keep this document open while reviewing, and refer to it as needed.


    Evaluation Criteria:

    Consistency (1-5) - the factual alignment between the prediction and the reference. A factually consistent prediction contains only statements that are entailed by the reference. Annotators were also asked to penalize predictions that contained hallucinated facts. 

    Evaluation Steps:

    1. Read the reference carefully and identify the main facts and details it presents.
    2. Read the prediction and compare it to the reference. Check if the prediction contains any factual errors that are not supported by the reference.
    3. Assign a score for consistency based on the Evaluation Criteria.

    Here is a example of input and output you can follow.
    Reference:

    I LOVE YOU.

    Prediction:

    I LOVE YOU.

    Evaluation Form (scores ONLY):

    - Consistency:

    5

  query: |
    Now rate the following example:

    Reference: 

    {{document}}

    Prediction: 

    {{summary}}


    Evaluation Form (scores ONLY):

    - Consistency:
  input_types: 
    document: str 
    summary: str

G_eval_quality:
  system: |
    You will be given one document.

    Your task is to evaluate how qualitative the document is.

    Please read these instructions carefully and keep them in mind while reviewing the document.

    Evaluation Criteria:

    Quality (1-5) - assesses the overall qualitative value of the document, including:
    - Clarity of writing and structure  
    - Depth of analysis and reasoning  
    - Relevance and usefulness of the information  
    - Coherence and logical flow  
    - Level of detail and explanation  

    Score Guide:
    1 - Very poor quality: unclear, superficial, disorganized, or not useful  
    2 - Poor quality: lacks depth, many unclear parts, weak structure  
    3 - Ok quality: acceptable but limited analysis or clarity  
    4 - Good quality: clear, coherent, informative with meaningful analysis  
    5 - Excellent quality: very clear, well-structured, insightful, and highly informative  

    Evaluation Steps:

    1. Read the document carefully from beginning to end.  
    2. Judge the clarity, structure, depth, and usefulness of the content.  
    3. Assign a single Quality score from 1 to 5 based on the criteria above.

    Example:

    document:
    This project analyzes the impact of renewable energy on local economies with clear data and explanations.

    Evaluation Form (scores ONLY):

    - Quality:
    4

  query: |
    Now rate the following example:

    document:

    {{document}}

    Evaluation Form (scores ONLY):

    - Quality:
  input_types:
    document: str


G_eval_coherence:
  system: |
    You will be given one document.

    Your task is to evaluate the coherence of the document.

    Please read these instructions carefully and keep them in mind while reviewing the document.

    Evaluation Criteria:

    Coherence (1-5) - assesses how logically and consistently the document is written, including:

    - Factual coherence: the document does not contradict itself and presents information that is internally consistent  
    - Logical flow: ideas are connected in a clear and meaningful order  
    - Absence of unnecessary repetition or redundancy  
    - Unity of topic: the document stays focused without irrelevant or conflicting statements  
    - Readability: sentences and paragraphs connect smoothly

    Score Guide:
    1 - Very poor coherence: many contradictions, chaotic structure, heavy repetition  
    2 - Poor coherence: frequent logical breaks or inconsistent statements  
    3 - Moderate coherence: generally understandable but with some repetition or weak transitions  
    4 - Good coherence: mostly logical and consistent with minor issues  
    5 - Excellent coherence: fully consistent, well organized, no unnecessary repetition  

    Evaluation Steps:

    1. Read the document carefully.  
    2. Check whether the facts and statements remain consistent throughout the text.  
    3. Examine the logical progression between ideas and sections.  
    4. Identify any repeated or redundant information.  
    5. Assign a single Coherence score from 1 to 5 based on the criteria above.

    Example:

    document:
    The study focuses on climate change impacts. It explains temperature rise and its effects. 
    Later, the document again repeats the same explanation about temperature rise without adding new information.

    Evaluation Form (scores ONLY):

    - Coherence:
    3

  query: |
    Now rate the following example:

    document:

    {{document}}

    Evaluation Form (scores ONLY):

    - Coherence:
  input_types:
    document: str
