actors_method:
  system: |
    You are an assistant that analyzes a collection of tweets and writes concise analytical sections. Focus only on numbers and not on the texts.

  examples:
    - role: user
      content: |
        <documents>
        Author : Alice  
        Post : Excited about the new project!  
        Count of records : 5  

        Author : Bob  
        Post : Working late again.  
        Count of records : 3  
        </documents>

    - role: assistant
      content: |
        The most talkative author in this period is Alice, who posted 5 tweets, making her the main contributor to the discussion. Bob follows with a total of 3 tweets, showing a moderate level of activity. Overall, the conversation is driven primarily by a small number of active users.

  query: |
    <documents>
    {% for doc in documents %}
    - {{ doc }}
    {% endfor %}
    </documents>

    Answer by writing a short section of 4 to 5 sentences about the most talkative authors and how much they tweeted.
    Only answer to this prompt, do not ask for follow up or add unnecessary comments at the end.


behavior_method:
  system: |
    You are an assistant that analyzes the content and tone of a collection of tweets and writes concise analytical sections.

  examples:
    - role: user
      content: |
        <documents>
        Author : Alice  
        Post : I really appreciate the constructive debate today.  
        Count of records : 4  

        Author : Bob  
        Post : This is ridiculous, nobody listens anymore!  
        Count of records : 2  
        </documents>

    - role: assistant
      content: |
        The overall tone of the discussion appears mixed, with some messages remaining civil while others express clear frustration. Alice’s contributions suggest a calm and constructive attitude, for example when she writes, "I really appreciate the constructive debate today." In contrast, Bob’s posts reveal a much angrier mood, illustrated by his statement, "This is ridiculous, nobody listens anymore!" These differences show that the exchange is not uniformly hostile but contains noticeable emotional tension.

  query: |
    <documents>
    {% for doc in documents %}
    - {{ doc }}
    {% endfor %}
    </documents>

    Analyze what the different authors are saying and describe the overall tone of the discussion.  
    Indicate whether the tweets seem civil and calm or rather angry and tense.  
    Illustrate your analysis with a few short quotes, mentioning the author of each quote.  
    Write a concise section of about 4 to 5 sentences.
    Only answer to this prompt, do not ask for follow up or add unnecessary comments at the end.


content_method:
  system: |
    You are an assistant that analyzes a collection of tweets concerning the president of the Ivory Coast and summarizes the main topics being discussed.

  examples:
    - role: user
      content: |
        <documents>
        Author : Alice  
        Post : The president’s economic reforms seem to help small businesses.  
        Count of records : 3  

        Author : Bob  
        Post : I am worried about the lack of transparency in the last speech.  
        Count of records : 2  

        Author : Clara  
        Post : Foreign policy under the president has become more balanced.  
        Count of records : 1  
        </documents>

    - role: assistant
      content: |
        1) Economic reforms: Several users discuss how the president’s recent economic measures are affecting daily life, particularly support for small businesses and employment.  
        2) Transparency and governance: Some tweets focus on concerns about the clarity of the president’s communication and decision-making process.  
        3) Foreign policy: Users mention the president’s approach to international relations, noting a shift toward a more balanced diplomatic strategy.

  query: |
    <documents>
    {% for doc in documents %}
    - {{ doc }}
    {% endfor %}
    </documents>
    
    Considering that these tweets discuss the president of the Ivory Coast, analyze all messages and identify the 4 to 6 main talking points mentioned by the users.  
    For each talking point, write 1 to 2 sentences explaining exactly what that point is about.  
    Present the result as a numbered list.
    Only answer to this prompt, do not ask for follow up or add unnecessary comments at the end.


diffuse_method:
  system: |
    You are an assistant that evaluates political narratives and estimates how likely they are to spread and convince a broad audience.

  examples:
    - role: user
      content: |
        <content>
        1) Economic reforms: Users argue that the president’s policies are improving jobs and small businesses.  
        2) Transparency concerns: Several posts claim the president is not open enough about key decisions.  
        3) Foreign policy: Some users praise a more balanced international approach.  
        </content>

    - role: assistant
      content: |
        The narrative about economic reforms is highly likely to spread because it relates directly to everyday living conditions and offers a positive, easy-to-understand message. The transparency concerns also have strong potential to convince people, as distrust in government is a common and emotionally powerful theme. The foreign policy narrative is less likely to circulate widely, since international affairs feel more distant to many citizens and generate weaker emotional reactions.

  query: |
    <content>
    {{content}}
    </content>

    Based on the main talking points provided above, evaluate how likely each narrative is to spread and convince people.  
    For each point, briefly explain the reasons for its potential impact or limitations in 1 to 2 sentences.

diffuse_method_v2:
  system: |
    You are an assistant that evaluates political narratives and estimates how likely they are to spread and convince a broad audience, particularly in the context of discussions about the president of the Ivory Coast.

  examples:
    - role: user
      content: |
        <content>
        1) Economic reforms: Users argue that the president’s policies are improving jobs and small businesses.  
        2) Transparency concerns: Several posts claim the president is not open enough about key decisions.  
        3) Foreign policy: Some users praise a more balanced international approach.  
        </content>

    - role: assistant
      content: |
        ### 1. Economic reforms  
        **Likelihood:** *Very High*  

        **Why?** This narrative is closely connected to everyday living conditions, which makes it easy for people to relate to and share with others.

        ### 2. Transparency concerns  
        **Likelihood:** *High*  

        **Why?** Messages about lack of transparency often resonate strongly because they tap into existing distrust toward political leaders.

        ### 3. Foreign policy  
        **Likelihood:** *Moderate*  

        **Why?** International affairs are less visible in daily life, so this topic may interest a smaller and more specialized audience.

        ---
        ### Key Factors Influencing Spread:
        - Emotional resonance and connection to daily life  
        - Level of trust or distrust toward institutions  
        - Perceived personal impact of each issue  

        **Most Viral Potential:** 1. Economic reforms  
        **Least Persuasive:** 3. Foreign policy

  query: |
    <content>
    {{content}}
    </content>

    Based on the main talking points provided above, evaluate how likely each narrative is to spread and convince people.  
    Respond using exactly this structure for each point:

    ### X. Title  
    **Likelihood:** *level*  

    **Why?** explanation in 1 to 2 sentences.

    After analyzing all points, finish with:

    ---
    ### Key Factors Influencing Spread:
    - factor 1  
    - factor 2  
    - factor 3  

    **Most Viral Potential:** X  
    **Least Persuasive:** Y

    It is very important to add an empty line between the likelihood and the why, as in Markdown they will otherwise appear close together.
    Only answer to this prompt, do not ask for follow up or add unnecessary comments at the end.

  input_types: null

entities_method:
  system: |
    You are an assistant that evaluates entities extracted from discussions about the president of the Ivory Coast and selects the most relevant ones for understanding public opinion.

  examples:
    - role: user
      content: |
        <entities>
        {"name":"terrorisme international","context":"Global terrorism threat addressed in discussions regarding military capabilities"}
        {"name":"réformes économiques","context":"Debates on the impact of the president’s economic policies on citizens"}
        {"name":"liberté de la presse","context":"Concerns about media freedom under the current administration"}
        {"name":"infrastructures","context":"Projects launched by the president to improve roads and electricity"}
        {"name":"relations avec la France","context":"Public reactions to diplomatic ties with France"}
        {"name":"jeunesse","context":"Expectations of young voters toward the president"}
        </entities>

    - role: assistant
      content: |
        The most interesting entity is réformes économiques, as it directly reflects how citizens judge the president’s concrete actions on living conditions. Liberté de la presse is also crucial because it reveals concerns about democratic space and criticism of presidential power. Infrastructures appear as a key topic, showing how people evaluate the president through visible development projects. Relations avec la France remain significant, since they influence perceptions of national sovereignty and leadership. Finally, jeunesse is essential to understand future political support, highlighting what younger assemblies expect from the president.

  query: |
    <entities>
    {% for e in entities %}
    - {{ e }}
    {% endfor %}
    </entities>

    From the entities listed above, select the 5 most interesting for understanding opinions about the president of the Ivory Coast.  
    Present them in a short paragraph, explaining briefly why each entity is relevant in 1 sentence per entity.
    Only answer to this prompt, do not ask for follow up or add unnecessary comments at the end.

  input_types: null
