            "key_points": [
                "Climate change represents one of the most pressing global challenges, with temperatures rising approximately 1.1°C since pre-industrial times.",
                "The primary cause is increased greenhouse gas emissions from human activities.",
                "Visible effects include melting ice caps, rising sea levels, more frequent extreme weather events, and worldwide ecosystem disruptions.",
                "The Paris Agreement, signed by 196 countries in 2015, aims to limit global warming to well below 2°C above pre-industrial levels.",
                "Renewable energy sources like solar and wind power are becoming increasingly cost-competitive with fossil fuels, enabling sustainable energy transition."
            ]
        }
        </response>

  query: |
    Please extract key points from the following text:
    <document>
    {{document.content}}
