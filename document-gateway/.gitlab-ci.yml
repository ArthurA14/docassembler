include:
  - local: 'ci-templates/variables/variables.yml'
  - local: 'ci-templates/base/stages.yml'
  - local: 'ci-templates/language/python.yml'
  - local: 'ci-templates/base/docker-build-push.yml'
  # - local: 'ci-templates/trigger/document-deployment.yml'

run:lint:
  stage: lint
  extends: .python:lint
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: $CI_COMMIT_BRANCH
    # - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success  # default behavior
      changes:
        - api_gateway/**/*
        - src/**/*
        - celery_tasks/**/*
        - pyproject.toml
        - uv.lock
        - Dockerfile
        - .dockerignore
        - .gitlab-ci.yml
        - ci-templates/**/*

# run:tests:
