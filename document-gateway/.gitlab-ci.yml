build:image:
  stage: build
  extends: .docker:build
  needs: # ["run:lint", "run:tests"]
    - job: run:lint
    # - job: run:tests
  rules:
    - if: '$CI_COMMIT_TAG'  # Build/push only on a tag
      when: on_success  # manual
    - if: '$CI_COMMIT_BRANCH'
    # - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
      changes:
        - api_gateway/**/*
        - src/**/*
        - celery_tasks/**/*
        - config/**/*
        - prompts/**/*
        - Dockerfile
        - .dockerignore
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
        - ci-templates/**/*
        - .gitignore
    # - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # Otherwise, if ...
    #   when: always
    - when: never # Otherwise, never execute

